name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # Layer 4 (skynetra.interface) is implemented against the current
      # Layer 1 domain contract; mypy/pytest cover the full package scope.
      - name: Type check with mypy
        run: mypy skynetra/foundation skynetra/domain skynetra/engines/routing skynetra/engines/physics skynetra/engines/workload skynetra/orchestration skynetra/interface

      - name: Test with pytest and coverage
        run: pytest tests/layer0 tests/layer1 tests/layer_boundaries tests/layer2/test_routing_shortest_path.py tests/layer2/test_routing_backpressure.py tests/layer2/test_layer2_routing_import_boundary.py tests/layer2/test_physics_thermal.py tests/layer2/test_physics_radiation.py tests/layer2/test_physics_power.py tests/layer2/test_physics_doppler.py tests/layer2/test_physics_orchestrator.py tests/layer2/test_layer2_physics_import_boundary.py tests/layer2/test_workload_ai_training.py tests/layer2/test_workload_inference.py tests/layer2/test_workload_federated.py tests/layer2/test_layer2_workload_import_boundary.py tests/layer3/test_context.py tests/layer3/test_events.py tests/layer3/test_engine.py tests/layer3/test_metrics_network.py tests/layer3/test_metrics_compute.py tests/layer3/test_metrics_physics.py tests/layer3/test_metrics_aggregator.py tests/layer3/test_metrics_registry.py tests/layer3/test_layer3_import_boundary.py tests/layer3/test_layer3_metrics_import_boundary.py tests/layer4/test_config.py tests/layer4/test_cli.py tests/layer4/test_viz.py tests/layer4/test_layer4_can_import_all_layers.py tests/integration/test_full_sim_shortest_path.py tests/integration/test_full_sim_backpressure.py tests/integration/test_full_sim_physics.py tests/integration/test_extension_composition.py tests/integration/test_scalability.py --cov=skynetra/foundation --cov=skynetra/domain --cov=skynetra/engines/routing --cov=skynetra/engines/physics --cov=skynetra/engines/workload --cov=skynetra/orchestration --cov=skynetra/interface

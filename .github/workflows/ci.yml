name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # Layers 2-4 (skynetra.engines/orchestration/interface) are being rebuilt
      # against the current Layer 1 domain contract; mypy/pytest stay scoped to
      # the implemented layers (L0 foundation, L1 domain, L2 routing + physics)
      # until each upper layer lands and the full-package scope is restored.
      - name: Type check with mypy
        run: mypy skynetra/foundation skynetra/domain skynetra/engines/routing skynetra/engines/physics

      - name: Test with pytest and coverage
        run: pytest tests/layer0 tests/layer1 tests/layer_boundaries tests/layer2/test_routing_shortest_path.py tests/layer2/test_routing_backpressure.py tests/layer2/test_layer2_routing_import_boundary.py tests/layer2/test_physics_thermal.py tests/layer2/test_physics_radiation.py tests/layer2/test_physics_power.py tests/layer2/test_physics_doppler.py tests/layer2/test_physics_orchestrator.py tests/layer2/test_layer2_physics_import_boundary.py --cov=skynetra/foundation --cov=skynetra/domain --cov=skynetra/engines/routing --cov=skynetra/engines/physics

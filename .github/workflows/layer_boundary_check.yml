name: Layer Boundary Check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  layer-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install import-linter
        run: pip install import-linter

      - name: Install skynetra
        run: pip install -e .

      - name: Check layer boundaries
        run: import-linter lint
